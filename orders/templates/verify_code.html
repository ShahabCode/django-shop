<h2>بررسی کد تایید</h2>
{% for message in messages %}
    <div>
    {{ message }}
    </div>
{% endfor %}
<form method="post">
    {% csrf_token %}
    <input type="text" name="code" placeholder="کد تایید را وارد کنید">
    <button type="submit">تایید کد</button>
</form>

<h3>زمان باقی‌مانده:</h3>
<p id="timer">--:--</p>

<script>
    let remaining = {{ remaining_seconds|default:0 }};

    const timer = document.getElementById('timer');

    function updateTimer() {
        const minutes = Math.floor(remaining / 60);
        const seconds = remaining % 60;

        timer.textContent =
            `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

        if (remaining <= 0) {
            timer.textContent = 'کد منقضی شده است';
            return;
        }

        remaining--;
        setTimeout(updateTimer, 1000);
    }

    updateTimer();
</script>
